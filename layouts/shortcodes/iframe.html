<div {{ with .Get "style" }}style="{{ . | safeCSS }}"{{ else }}style="display:flex;justify-content:center"{{ end }}>
  <iframe 
    {{ with .Get "src" }} src="{{ . }}"{{ end }}
    {{ with .Get "width" }} width="{{ . }}"{{ end }}
    {{ with .Get "height" }} height="{{ . }}"{{ end }}>
  </iframe>
</div>
